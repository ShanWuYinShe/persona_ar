name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-evidence-images:
    name: 证据图不得入库
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 检查 .github/pr-evidence
        run: |
          if git ls-files | grep -qE '(^|/)pr-evidence/'; then
            echo "::error title=证据图不得入库::发现证据图被提交进仓库。一次性 PR 截图请用 gh 的 --attach 上传，不要提交进仓库。"
            git ls-files | grep -E '(^|/)pr-evidence/'
            exit 1
          fi
          echo "OK: 未发现证据图入库"

  test-server:
    name: Go Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: server/go.sum

      - name: Run Go tests
        working-directory: ./server
        run: |
          go test -v ./...

  build-docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server Docker image
        run: |
          docker build -t persona-ar-server:test ./server

  build-android:
    name: Android Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install required SDK platform
        run: |
          # Filament 1.81 要求 compileSdk 37；SDK 仓库以次版本包名发布 API 37（platforms;android-37.0，无整数命名的 android-37）。
          # 直接用 runner 预装 SDK 里的 sdkmanager：不引入 android-actions/setup-android，
          # 该 action v3 会执行 `sdkmanager tools`，而 "tools" 包已从 SDK 仓库移除，会直接失败。
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release（验证签名配置）
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
