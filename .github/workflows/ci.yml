name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  no-evidence-images:
    name: 证据图不得入库
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 检查 .github/pr-evidence
        run: |
          if git ls-files | grep -qE '(^|/)pr-evidence/'; then
            echo "::error title=证据图不得入库::发现证据图被提交进仓库。一次性 PR 截图请用 gh 的 --attach 上传，不要提交进仓库。"
            git ls-files | grep -E '(^|/)pr-evidence/'
            exit 1
          fi
          echo "OK: 未发现证据图入库"

  test-server:
    name: Go Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: server/go.sum

      - name: Run Go tests
        working-directory: ./server
        run: |
          go test -v ./...

  build-docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server Docker image
        run: |
          docker build -t persona-ar-server:test ./server

  build-android:
    name: Android Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform
        run: |
          # Filament 1.81 要求 compileSdk 37；SDK 仓库以次版本包名发布 API 37（platforms;android-37.0）
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
